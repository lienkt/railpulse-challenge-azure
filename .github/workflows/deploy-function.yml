name: Deploy Azure Function

on:
  push:
    branches:
      - main

  # Cho phép chạy thủ công từ GitHub Actions
  workflow_dispatch:

env:
  # Thay bằng tên Azure Function App thật của bạn
  AZURE_FUNCTIONAPP_NAME: "railpulse-function-fjb6akbnbhbubuhv"

  # Project Azure Function nằm tại root repository
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "."

  # Phải khớp với Python version của Function App
  PYTHON_VERSION: "3.11"

jobs:
  validate-and-deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest

    steps:
      # Bước 1: tải source code từ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: cài đúng phiên bản Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Bước 3: cài dependencies để kiểm tra project
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Bước 4: kiểm tra lỗi cú pháp Python
      - name: Validate Python syntax
        run: |
          python -m compileall function_app.py

      # Bước 5: deploy lên Azure Function Flex Consumption
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

          # Bắt buộc khi Flex Consumption dùng publish profile
          sku: flexconsumption

          # Azure cài requirements.txt bằng remote Oryx build
          remote-build: true

          # Áp dụng các file/folder trong .funcignore
          respect-funcignore: true
